parameters:
    database_path: '%kernel.build_dir%/test.db'

framework:
    test:       ~
    assets:     ~
    secret:     secret
    translator: { fallbacks:['fr'] }
    router:
        resource: "%kernel.project_dir%/App/config/routing.yaml"
        utf8: true
    session:
        storage_factory_id: session.storage.factory.mock_file

twig:
    strict_variables: false
    paths:
        - '%kernel.project_dir%/App/templates/'

doctrine:
    dbal:
        driver:   pdo_sqlite
        dbname:   orbitale_cms_test
        user:     root
        charset:  UTF8
        path:     '%database_path%'
    orm:
        auto_generate_proxy_classes: true
        auto_mapping: true

orbitale_cms:
    page_class: Orbitale\Bundle\CmsBundle\Tests\Fixtures\TestBundle\Entity\Page
    category_class: Orbitale\Bundle\CmsBundle\Tests\Fixtures\TestBundle\Entity\Category
